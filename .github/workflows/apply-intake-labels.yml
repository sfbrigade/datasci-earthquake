name: Apply intake labels

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: >-
      !contains(github.event.issue.labels.*.name, 'needs triage') ||
      !contains(github.event.issue.labels.*.name, 'needs refinement')
    runs-on: ubuntu-latest
    steps:
      - name: Add intake labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GH_REPO" \
            --add-label "needs triage,needs refinement"
