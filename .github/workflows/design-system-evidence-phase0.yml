name: Design-system evidence Phase 0

on:
  push:
    branches:
      - theme-evidence-phase0
    paths:
      - "scripts/design-system/evidence/**"
      - ".github/workflows/design-system-evidence-phase0.yml"
      - "app/**/*.ts"
      - "app/**/*.tsx"
      - "styles/theme.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

jobs:
  typescript-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-using-nvmrc
      - run: npm ci
      - name: Run TypeScript extraction baseline twice
        run: |
          node scripts/design-system/evidence/phase0-benchmark.mjs .tmp/design-system/phase0-typescript-a.json
          node scripts/design-system/evidence/phase0-benchmark.mjs .tmp/design-system/phase0-typescript-b.json
          cmp .tmp/design-system/phase0-typescript-a.json .tmp/design-system/phase0-typescript-b.json
          cp .tmp/design-system/phase0-typescript-a.json .tmp/design-system/phase0-typescript.json
      - name: Run TypeScript reachability baseline twice
        run: |
          node scripts/design-system/evidence/phase0-reachability.mjs .tmp/design-system/phase0-reachability-a.json
          node scripts/design-system/evidence/phase0-reachability.mjs .tmp/design-system/phase0-reachability-b.json
          cmp .tmp/design-system/phase0-reachability-a.json .tmp/design-system/phase0-reachability-b.json
          cp .tmp/design-system/phase0-reachability-a.json .tmp/design-system/phase0-reachability.json
      - name: Run TypeChecker outside-JSX probe twice
        run: |
          node scripts/design-system/evidence/phase0-typechecker.mjs .tmp/design-system/phase0-typechecker-a.json
          node scripts/design-system/evidence/phase0-typechecker.mjs .tmp/design-system/phase0-typechecker-b.json
          cmp .tmp/design-system/phase0-typechecker-a.json .tmp/design-system/phase0-typechecker-b.json
          cp .tmp/design-system/phase0-typechecker-a.json .tmp/design-system/phase0-typechecker.json
      - name: Run controlled Chakra semantic probe twice
        run: |
          node scripts/design-system/evidence/phase0-chakra.mjs .tmp/design-system/phase0-chakra-a.json
          node scripts/design-system/evidence/phase0-chakra.mjs .tmp/design-system/phase0-chakra-b.json
          cmp .tmp/design-system/phase0-chakra-a.json .tmp/design-system/phase0-chakra-b.json
          cp .tmp/design-system/phase0-chakra-a.json .tmp/design-system/phase0-chakra.json
      - name: Run Chakra-domain precision classifier twice
        run: |
          node scripts/design-system/evidence/phase0-classifier.mjs .tmp/design-system/phase0-classifier-a.json
          node scripts/design-system/evidence/phase0-classifier.mjs .tmp/design-system/phase0-classifier-b.json
          cmp .tmp/design-system/phase0-classifier-a.json .tmp/design-system/phase0-classifier-b.json
          cp .tmp/design-system/phase0-classifier-a.json .tmp/design-system/phase0-classifier.json
      - name: Validate draft evidence v1 contract
        run: |
          node scripts/design-system/evidence/validate-evidence-v1.mjs scripts/design-system/evidence/fixtures/evidence-v1.valid.json
          if node scripts/design-system/evidence/validate-evidence-v1.mjs scripts/design-system/evidence/fixtures/evidence-v1.invalid.json; then
            echo "invalid evidence fixture was incorrectly accepted"
            exit 1
          fi
          npx --yes ajv-cli@5.0.0 validate --spec=draft7 \
            -s scripts/design-system/evidence/safehome.design-system-evidence.v1.schema.json \
            -d scripts/design-system/evidence/fixtures/evidence-v1.valid.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft7 \
            -s scripts/design-system/evidence/safehome.design-system-evidence.v1.schema.json \
            -d scripts/design-system/evidence/fixtures/evidence-v1.invalid-cases.json
          if node scripts/design-system/evidence/validate-evidence-v1.mjs scripts/design-system/evidence/fixtures/evidence-v1.invalid-cases.json; then
            echo "condition-case adversarial fixture was incorrectly accepted"
            exit 1
          fi
      - name: Generate repo-wide evidence preview twice
        run: |
          node scripts/design-system/evidence/generate-evidence-v1.mjs .tmp/design-system/evidence-v1-preview-a.json
          node scripts/design-system/evidence/generate-evidence-v1.mjs .tmp/design-system/evidence-v1-preview-b.json
          cmp .tmp/design-system/evidence-v1-preview-a.json .tmp/design-system/evidence-v1-preview-b.json
          cp .tmp/design-system/evidence-v1-preview-a.json .tmp/design-system/evidence-v1-preview.json
          node scripts/design-system/evidence/validate-evidence-v1.mjs .tmp/design-system/evidence-v1-preview.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft7 \
            -s scripts/design-system/evidence/safehome.design-system-evidence.v1.schema.json \
            -d .tmp/design-system/evidence-v1-preview.json
      - name: Run Knip production oracle
        continue-on-error: true
        run: |
          mkdir -p .tmp/design-system
          KNIP_VERSION="$(npm view knip version)"
          printf '%s\n' "$KNIP_VERSION" > .tmp/design-system/phase0-knip-version.txt
          npx --yes "knip@$KNIP_VERSION" --production --reporter json > .tmp/design-system/phase0-knip.json
      - name: Show compact receipts
        if: always()
        run: |
          node -e 'const r=require("./.tmp/design-system/phase0-typescript.json"); console.log(JSON.stringify({schema:r.schema,parser:r.parser,oracle:r.oracle,score:r.score,extraction:r.extraction}))'
          node -e 'const r=require("./.tmp/design-system/phase0-reachability.json"); console.log(JSON.stringify({schema:r.schema,entrypointPolicy:r.entrypointPolicy,counts:r.counts,sentinels:r.sentinels}))'
          node -e 'const r=require("./.tmp/design-system/phase0-typechecker.json"); console.log(JSON.stringify({schema:r.schema,sentinels:r.sentinels}))'
          node -e 'const r=require("./.tmp/design-system/phase0-chakra.json"); console.log(JSON.stringify({schema:r.schema,tokenSurface:r.tokenSurface,probes:r.probes}))'
          node -e 'const r=require("./.tmp/design-system/phase0-classifier.json"); console.log(JSON.stringify({schema:r.schema,sentinels:r.sentinels,counts:r.counts,exactCaseGroups:r.exactCaseGroups}))'
          node -e 'const r=require("./.tmp/design-system/evidence-v1-preview.json"); console.log(JSON.stringify({schema:r.schema,sourceIdentity:r.sourceIdentity,toolchain:r.toolchain,coverage:r.coverage,counts:{files:r.files.length,sourceFacts:r.sourceFacts.length,moduleFacts:r.moduleFacts.length,reachabilityClaims:r.reachabilityClaims.length,semanticFacts:r.semanticFacts.length,claims:r.claims.length}}))' || true
          printf 'KNIP_VERSION=' && cat .tmp/design-system/phase0-knip-version.txt || true
          cat .tmp/design-system/phase0-knip.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-system-evidence-phase0-typescript
          path: .tmp/design-system/*
