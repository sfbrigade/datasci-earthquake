name: Feature
description: Propose a product feature or enhancement
type: Feature
labels: ["needs triage", "needs refinement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      value: |
        _What problem should this Feature address? Describe the situation, what someone is trying to do, and what gets in the way._

        <!-- Focus on the problem, not a proposed solution. -->
    validations:
      required: true

  - type: textarea
    id: feature-definition
    attributes:
      label: Feature definition
      value: |
        #### Desired outcome
        _What should be possible once this problem is solved?_

        #### Out of scope
        _What related work is intentionally excluded?_

        #### Acceptance criteria
        _What must be observably true for this Feature to be complete?_

        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      value: |
        _Replace each `https://..` with a link, note, or "Not needed."._
        - **Design:** https://..
        - **Data science:** https://..
        - **Engineering:** https://..
        #### Additional context
        _What else is worth knowing about this Feature?_
    validations:
      required: false

  - type: textarea
    id: work-items
    attributes:
      label: Work items
      value: |
        _Keep only what applies; add anything missing._

        <!-- Use Sub-issues for substantial or independently owned work; use GitHub Relationships for dependencies. -->

        - [ ] Create Design spec
        - [ ] Conduct Data science analysis
        - [ ] Create Engineering spec
        - [ ] Implement Feature
        - [ ] Validate Feature
        - [ ] Run Design QA
        - [ ] Validate Data / domain
        - [ ] Run Product QA
    validations:
      required: false
