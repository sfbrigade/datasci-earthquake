name: Feature
description: Propose a product feature or enhancement
type: Feature
labels: ["needs triage", "needs refinement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the situation, the progress someone is trying to make, and what
        gets in the way today. If useful, try: When [situation], I want to
        [make progress], so I can [desired outcome].
      placeholder: |
        When I'm looking at my address's results and see a hazard term I don't
        recognize, I want to understand what it means so I can judge whether
        it changes my decision.

        Today, there isn't a clear, plain-language explanation available in the
        results.
    validations:
      required: true

  - type: textarea
    id: feature-definition
    attributes:
      label: Feature definition
      description: >-
        Optional at first. Refine as the feature becomes clearer.
      value: |
        **Desired outcome**
        <!-- What should be possible once this problem is solved? -->

        **Out of scope**
        <!-- What related work is intentionally excluded? -->

        **Acceptance criteria**
        <!-- What must be observably true for this feature to be complete? -->
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Keep relevant specs, research, decisions, constraints, and results here
        as the feature evolves.
      value: |
        **Design:**
        <!-- Add the relevant Sub-issue, artifact/link, decision, or result;
        or "Not needed." -->

        **Data science:**
        <!-- Add the relevant Sub-issue, artifact/link, decision, or result;
        or "Not needed." -->

        **Engineering:**
        <!-- Add the relevant Sub-issue, artifact/link, decision, or result;
        or "Not needed." -->

        **Additional context**
        <!-- Add anything else worth knowing about this feature. -->
    validations:
      required: false

  - type: textarea
    id: work-items
    attributes:
      label: Work items
      description: >-
        Typical feature work. Use GitHub Relationships for dependencies.
      value: |
        Keep only what applies. Add anything missing. For larger items, create a
        Task or Feature, then return here and add it as a Sub-issue. Or convert
        the checklist item to a Sub-issue.

        - [ ] Refine Feature definition
        <!-- Optional work items: uncomment any that apply. -->
        <!-- - [ ] Create Design spec -->
        <!-- - [ ] Conduct Data science analysis -->
        <!-- - [ ] Create Engineering spec -->
        - [ ] Implement Feature
        - [ ] Validate Feature
              <!-- Optional validation work. Uncomment what applies.
              These may be owned by other contributors. -->
              <!-- - [ ] Run Design QA -->
              <!-- - [ ] Validate Data / domain -->
              <!-- - [ ] Run Product QA -->
    validations:
      required: false
