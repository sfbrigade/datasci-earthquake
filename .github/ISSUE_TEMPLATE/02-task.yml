name: Task
description: Plan or track a specific piece of work
type: Task
labels: ["needs triage", "needs refinement"]

body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: >-
        Describe the work to do and why it matters.
      placeholder: |
        Create the design spec for the hazard-term explanation, including its
        placement, interaction states, and responsive behavior.
    validations:
      required: true

  - type: textarea
    id: completion-criteria
    attributes:
      label: Completion criteria
      description: >-
        What must be true for this task to be complete?
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        References, constraints, decisions, and other useful context.
      value: |
        **Reference(s):**
        <!-- e.g. a URL, spec, design artifact, issue, PR, or other relevant
        source. -->

        **Additional context**
        <!-- Add anything else worth knowing about this task. -->
    validations:
      required: false
