name: Feature
description: Propose a product feature or enhancement
type: Feature
labels: ["needs triage"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the situation, the progress someone is trying to make, and what
        gets in the way today. If useful, try: When [situation], I want to
        [make progress], so I can [desired outcome].
      placeholder: |
        When I'm looking at my address's results and see a hazard term I don't
        recognize, I want to understand what it means so I can judge whether
        it changes my decision.

        Today, there isn't a clear, plain-language explanation available in the
        results.
    validations:
      required: true

  - type: textarea
    id: feature-definition
    attributes:
      label: Feature definition
      description: >-
        Optional at first. Refine as the feature becomes clearer.
      value: |
        **Desired outcome**
        <!-- What should be possible once this problem is solved? -->

        **Out of scope**
        <!-- What related work is intentionally excluded? -->

        **Acceptance criteria**
        <!-- What must be observably true for this feature to be complete? -->
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Specs, research, decisions, constraints, and related issues.
      value: |
        **Design spec:** https://...
        **Data science analysis:** https://...
        **Engineering spec:** https://...

        **Additional context**
        <!-- Add anything else worth knowing about this feature. -->

        **Related issue(s):** #...
    validations:
      required: false

  - type: textarea
    id: work-items
    attributes:
      label: Work items
      description: >-
        Typical feature work. Remove or add items as needed; turn larger items
        into sub-issues. Use GitHub Relationships for dependencies.
      value: |
        - [ ] Product refinement
        - [ ] Design spec
        - [ ] Data science analysis
        - [ ] Engineering spec
        - [ ] Implementation
        - [ ] Design QA
        - [ ] Data / domain validation
        - [ ] Product QA
    validations:
      required: false
