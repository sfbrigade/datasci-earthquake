name: Feature
description: Propose a product feature or enhancement
type: Feature
labels: ["needs triage"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Use a Jobs-to-be-Done frame: When [situation], I want to [make progress],
        so I can [desired outcome]. Then briefly say what gets in the way today.
      placeholder: |
        When I'm trying to make a decision and I run into information I don't
        understand, I want a clear explanation in context, so I can decide what
        to do with confidence.

        Today, I have to stop what I'm doing and look elsewhere for an explanation.
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: >-
        What should be possible once the problem is solved? Describe the result,
        not a specific solution.
      placeholder: |
        Users can understand the information they need and continue their task
        without losing context.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        What must be observably true for this feature to be acceptable to ship?
        Include edge cases, accessibility, or no-regression behavior when relevant.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: >-
        Related work this feature deliberately does not include.
      placeholder: |
        - Similar needs elsewhere in the product
        - Translation or localization
    validations:
      required: false

  - type: textarea
    id: background
    attributes:
      label: Background
      description: >-
        Optional context, constraints, prior decisions, alternatives already
        explored, or useful links.
    validations:
      required: false

  - type: textarea
    id: work-items
    attributes:
      label: Work items
      description: >-
        Starter work for refinement. Add, remove, or split items as needed;
        convert them to sub-issues when they need separate tracking.
      value: |
        - [ ] Design spec / handoff (if needed)
        - [ ] Engineering spec / plan (if needed)
        - [ ] Implementation
        - [ ] Design QA (if needed)
    validations:
      required: false
