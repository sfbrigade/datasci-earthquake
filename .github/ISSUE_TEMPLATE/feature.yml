name: Feature
description: Propose a product feature or enhancement
type: Feature
labels: ["needs triage"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the situation, the progress someone is trying to make, and what
        gets in the way today. If useful, try: When [situation], I want to
        [make progress], so I can [desired outcome].
      placeholder: |
        When I'm looking at my address's results and see a hazard term I don't
        recognize, I want to understand what it means so I can judge whether
        it changes my decision.

        Today, there isn't a clear, plain-language explanation available in the
        results.
    validations:
      required: true

  - type: textarea
    id: feature-definition
    attributes:
      label: Feature definition
      description: >-
        Optional at first. Refine as the feature becomes clearer.
      value: |
        **Desired outcome**
        <!-- What should be possible once this problem is solved? -->

        **Out of scope**
        <!-- What related work is intentionally excluded? -->

        **Acceptance criteria**
        <!-- What must be observably true for this feature to be complete? -->
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Specs, research, decisions, constraints, and other useful context.
      value: |
        **Design:** ...
        <!-- e.g. a URL/Figma artifact, Design Task/Sub-issue, inline notes,
        or "No separate spec needed." -->

        **Data science:** ...
        <!-- e.g. a URL/notebook/report, analysis Task/Sub-issue, inline
        findings, or "Not needed." -->

        **Engineering:** ...
        <!-- e.g. a URL/technical plan/ADR, Engineering Task/Sub-issue, inline
        notes, or "No separate spec needed." -->

        **Additional context**
        <!-- Add anything else worth knowing about this feature. -->
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        For larger work items, either:
        - use the [Task form](https://github.com/sfbrigade/datasci-earthquake/issues/new?template=task.yml), then add the resulting Task as a Sub-issue; or
        - convert the work item directly into a Sub-issue.

  - type: textarea
    id: work-items
    attributes:
      label: Work items
      description: >-
        Typical feature work. Remove or add items as needed.
        Use GitHub Relationships for dependencies.
      value: |
        - [ ] Refine feature definition
        - [ ] Create design spec
        - [ ] Create data science analysis
        - [ ] Create engineering spec
        - [ ] Implement feature
        - [ ] Validate design
        - [ ] Validate data / domain
        - [ ] Validate product
    validations:
      required: false
