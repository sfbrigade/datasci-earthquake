name: Feature
description: Propose a product feature or enhancement
type: Feature
labels: ["needs triage"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the situation, the progress someone is trying to make, and what
        gets in the way today. If useful, try: When [situation], I want to
        [make progress], so I can [desired outcome].
      placeholder: |
        When I'm looking at my address's results and see a hazard term I don't
        recognize, I want to understand what it means so I can judge whether
        it changes my decision.

        Nothing on the page defines these terms, and the official sources are
        written for engineers.
    validations:
      required: true

  - type: textarea
    id: feature-definition
    attributes:
      label: Feature definition
      description: >-
        Optional at first. Fill in what is known and revise during refinement.
      value: |
        **Desired outcome**
        <!-- What should be possible once the problem is solved? Describe the
        result, not a specific UI or implementation. -->

        **Out of scope**
        <!-- Related work this feature deliberately does not include. -->

        **Acceptance criteria**
        <!-- What must be observably true for this feature to be acceptable to
        ship? Consider edge cases, accessibility, and behavior that must not
        regress. -->
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: background
    attributes:
      label: Background / references
      description: >-
        Optional context or references, such as research, design specs, prior
        decisions, constraints, related issues, or useful links.
      placeholder: |
        Official liquefaction sources are useful for validating the explanation,
        but are generally written for technical audiences.

        Design spec: ...
        Engineering spec: ...
        Related issue: #...
    validations:
      required: false

  - type: textarea
    id: work-items
    attributes:
      label: Work items
      description: >-
        Starter work for refinement. Add, remove, or split items as needed;
        convert them to sub-issues when they need separate tracking.
      value: |
        - [ ] Design spec / handoff
        - [ ] Engineering spec / plan
        - [ ] Implementation
        - [ ] Design QA
        - [ ] Product QA
    validations:
      required: false
