# Docker Compose configuration for local development and CI pipeline.
# Not used for production; production is deployed via hosting platform.
#
# ENVIRONMENT=dev_docker is set on every service here. This value controls:
#   - backend/database/session.py  → connects to the local Docker PostgreSQL container
#   - next.config.ts               → routes /api/* to http://backend:8000 (Docker service mesh)
#   - backend/etl/startup.sh       → enables --reload flag and verbose tracing
#
# This file is used in two contexts:
#   1. Local Docker development  (`docker compose up`)
#   2. CI integration tests      (docker_build_test job in ci.yml runs pytest inside Docker)
#
# In both cases the environment is dev_docker, not ci. The ENVIRONMENT=ci value is only
# set by the nextjs_build_check job in ci.yml, which runs npm run build directly on the
# runner without Docker and never connects to a database. See ci.yml for details.

services:
  db:
    image: postgis-custom
    build:
      context: ./backend/database
      dockerfile: Dockerfile
    container_name: my_postgis_db
    restart: always
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev_docker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db_test:
    build:
      context: ./backend/database
      dockerfile: Dockerfile
    container_name: my_postgis_db_test
    restart: always
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev_docker
    volumes:
      - ./backend/database:/docker-entrypoint-initdb.d # Mount the SQL scripts directory
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      - db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/backend:/
      - DATA_GEOJSON_PATH=/public/data/
      - ENVIRONMENT=dev_docker
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/backend
      - ./backend/etl/startup.sh:/startup.sh
      - public_data:/public/data
    command: bash /startup.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev_docker
    ports:
      - 3000:3000
    depends_on:
      - backend
    volumes:
      - .:/app:rw,delegated # Mount after dependencies are installed
      - /app/node_modules # This excludes the node_modules from being overwritten
      - nextjs_cache:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  db-data:
  nextjs_cache:
  public_data:
